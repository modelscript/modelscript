[package]
name = "modelscript-desktop"
version = "0.0.18"
description = "ModelScript Multi-Domain Modeling, Simulation & Systems Engineering Studio"
authors = ["Mohamad Omar Nachawati <omar@modelscript.org>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/modelscript/modelscript"
edition = "2021"

[lib]
name = "modelscript_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
