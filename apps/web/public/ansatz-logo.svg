  <!-- Facet 2: Right descending wing (Electric Sky/Cyan) -->
  <polygon points="23,14.1 29.5,25.2 27.2,29 19.2,15.2" fill="#38bdf8" />
  <!-- Facet 3: Inner floating delta bridge (Cool Slate) -->
  <polygon points="14.4,29 25,29 22.7,24.6 16.9,24.6" fill="#94a3b8" />
