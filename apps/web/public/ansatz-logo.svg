<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="ansatzGlow" cx="78%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ansatzBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
  </defs>
  <!-- Obsidian Squircle Tile -->
  <rect width="36" height="36" rx="9" fill="url(#ansatzBg)" />
  <rect width="36" height="36" rx="9" fill="url(#ansatzGlow)" />
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="#ffffff" stroke-opacity="0.14" />
  <!-- K3-D Sharp Mitre Fold (3-Facet Depth) -->
  <!-- Facet 1: Left ascending wing (Pure White) -->
