# Optional standalone single-node Slurm dev cluster with slurmrestd and MinIO S3 object staging
services:
  slurm:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: modelscript-slurm-dev
    hostname: slurm-dev
    ports:
      - "6817:6817" # slurmctld
      - "6818:6818" # slurmd
      - "6819:6819" # slurmdbd
    volumes:
      - ./data/shared-slurm-workspace:/workspace:rw
    environment:
      - SLURM_CPUS_ON_NODE=8
    restart: unless-stopped

  slurmrestd:
    image: giovtorres/slurm-docker-cluster:latest
    container_name: modelscript-slurmrestd-dev
    command: ["slurmrestd", "-a", "rest_auth/jwt", "0.0.0.0:6820"]
    ports:
      - "6820:6820"
    environment:
      - SLURM_JWT=daemon
    depends_on:
      - slurm
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: modelscript-minio-dev
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./data/minio-dev-data:/data
    restart: unless-stopped
