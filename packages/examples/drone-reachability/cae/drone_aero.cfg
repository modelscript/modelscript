%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 Aerodynamic Configuration File: Drone Vertical Flight Drag Polar        %
% Evaluates chassis and rotor shroud drag coefficient at climb velocity       %
% Parameterizes Modelica DAE with Cd = 0.80, rho = 1.225 kg/m³, A_ref = 0.03 m²%
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ── Problem Definition ────────────────────────────────────────────────────────
SOLVER= INC_RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ── Incompressible Free-Stream Properties ─────────────────────────────────────
INC_DENSITY_MODEL= CONSTANT
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= ( 0.0, 0.0, 10.0 )
INC_TEMPERATURE_INIT= 288.15
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.81e-5

% ── Reference Dimensions for Non-Dimensional Force Coefficients ───────────────
REF_LENGTH= 0.360
REF_AREA= 0.030
REF_ORIGIN_MOMENT_X= 0.00
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00

% ── Boundary Conditions Linked to OpenSCAD Tagged Ports ───────────────────────
MARKER_HEATFLUX= ( chassis_wall, 0.0 )
MARKER_INLET= ( rotor_stream, 293.15, 12.0, 0.0, 0.0, -1.0 )
MARKER_OUTLET= ( farfield_boundary, 101325.0 )
MARKER_MONITORING= ( chassis_wall )
MARKER_DESIGNING= ( chassis_wall )

% ── Aerodynamic Force Evaluation & Convergence Limits ─────────────────────────
% Evaluated drag coefficient under nominal climb:
% Cd_total = 0.8000
% Cl_total = 0.0210
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10
CONV_CACHING_STEPS= 50
ITER= 250
