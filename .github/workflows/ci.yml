name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-prefix: "lint"
          cache-wasm: "true"
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Run Repository Hygiene Doctor
        run: npm run lint:repo
      - name: Build DSL Templates
        run: pnpm --filter @modelscript/dsl run build:templates
      - name: Check Root TypeScript Config
        run: npx tsc --noEmit
      - name: Lint Root Scripts
        run: npm run lint:scripts
      - name: Run Lint
        run: npx nx affected -t lint --parallel=3
      - name: Run Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || ( [ -n "$NX_BASE" ] && git rev-parse --verify "$NX_BASE" >/dev/null 2>&1 ); then
            npx nx affected -t typecheck --parallel=3
          else
            npx nx run-many -t typecheck --parallel=3
          fi

  test:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-prefix: "test-${{ matrix.shard }}"
          cache-wasm: "true"
          build-dsl-templates: "true"
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Cache MSL
        id: cache-msl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scripts/ModelicaStandardLibrary_v4.1.0.zip
            data/libraries/Modelica/4.1.0/extracted
          key: ${{ runner.os }}-msl-v4.1.0
      - name: Download and Extract MSL
        run: |
          if [ ! -f "scripts/ModelicaStandardLibrary_v4.1.0.zip" ] || [ ! -d "data/libraries/Modelica/4.1.0/extracted/Modelica" ]; then
            node scripts/build/download-msl.cjs --version=4.1.0 --extract --outDir=data/libraries/Modelica/4.1.0/extracted
          fi
      - name: Cache FMI Simulator
        id: cache-fmusim
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/exchange/validation/fmi/reference_fmus
          key: ${{ runner.os }}-fmusim-v0.0.39
      - name: Fetch FMI Simulator
        if: steps.cache-fmusim.outputs.cache-hit != 'true'
        run: pnpm --filter @modelscript/exchange run fetch:fmusim
      - name: Build Prerequisites
        run: npx nx run-many -t build --projects=@modelscript/dsl,@modelscript/runtime,@modelscript/modelica
      - name: Run Sharded Tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || ( [ -n "$NX_BASE" ] && git rev-parse --verify "$NX_BASE" >/dev/null 2>&1 ); then
            node scripts/ci/test-coordinator.js affected --shard=${{ matrix.shard }}/8
          else
            node scripts/ci/test-coordinator.js run-many --shard=${{ matrix.shard }}/8
          fi
      - name: Upload CTRF Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctrf-${{ matrix.shard }}
          path: |
            packages/*/ctrf/*.json
            languages/*/ctrf/*.json
            apps/*/ctrf/*.json
            ee/ctrf/*.json
          if-no-files-found: ignore
          retention-days: 7
        if: always()
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            packages/*/coverage/*lcov*.info
            languages/*/coverage/*lcov*.info
            apps/*/coverage/*lcov*.info
            ee/coverage/*lcov*.info
          if-no-files-found: ignore
          retention-days: 7
        if: always()

  modelica_testsuite:
    name: Modelica OMC Testsuite (WASM vs JS)
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-prefix: "omc"
          cache-wasm: "false"
          build-dsl-templates: "true"
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Check If Modelica Affected
        id: check-affected
        run: |
          BASE_REF="${NX_BASE:-HEAD~1}"
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: running full testsuite."
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
          else
            AFFECTED=$(npx nx show projects --affected --base="$BASE_REF" --head=HEAD --projects=@modelscript/modelica,@modelscript/dsl,@modelscript/runtime,@modelscript/simulate || true)
            MO_CHANGED=$(git diff --name-only "$BASE_REF" HEAD | grep -E '(^languages/modelica/testsuite/|\.mo$)' || true)
            RUNNER_CHANGED=$(git diff --name-only "$BASE_REF" HEAD | grep -E 'languages/modelica/tests/testsuite-runner\.ts' || true)
            if [ -n "$AFFECTED" ] || [ -n "$MO_CHANGED" ] || [ -n "$RUNNER_CHANGED" ]; then
              echo "Compiler projects, .mo tests, or testsuite runner affected: $AFFECTED $MO_CHANGED $RUNNER_CHANGED"
              echo "run_suite=true" >> "$GITHUB_OUTPUT"
            else
              echo "No Modelica compiler packages or testsuite files affected. Skipping testsuite."
              echo "run_suite=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Cache WASM Parsers
        if: steps.check-affected.outputs.run_suite == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/asc-tests
            languages/*/.cache
            languages/*/dist/*.wasm
            packages/runtime/build/*.wasm
            packages/simulate/src/wasm/*.wasm
            packages/simulate/.cache/**
            packages/dsl/.cache/**
          key: ${{ runner.os }}-wasm-${{ hashFiles('packages/dsl/src/**', 'packages/runtime/src/wasm/**', 'packages/runtime/assembly/**', 'languages/*/assembly/**') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Build Prerequisites
        if: steps.check-affected.outputs.run_suite == 'true'
        run: npx nx run-many -t build --projects=@modelscript/dsl,@modelscript/runtime,@modelscript/modelica
      - name: Run Modelica Dual Testsuite (WASM vs JS)
        if: steps.check-affected.outputs.run_suite == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          mkdir -p .v8-coverage languages/modelica/coverage/omc
          NODE_V8_COVERAGE=$(pwd)/.v8-coverage npm run test:modelica:both:allow-wasm
          NODE_OPTIONS="--max-old-space-size=12288" npx c8 report --temp-directory=.v8-coverage --reporter=lcov --reports-dir=languages/modelica/coverage/omc --include="languages/modelica/src/**" --include="packages/dsl/src/**" --include="packages/runtime/src/**"
      - name: Upload CTRF Artifacts
        if: always() && steps.check-affected.outputs.run_suite == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctrf-omc-testsuite
          path: |
            languages/modelica/ctrf/ctrf-testsuite-report-wasm.json
            languages/modelica/ctrf/ctrf-testsuite-report-js.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload HTML Test Reports
        if: always() && steps.check-affected.outputs.run_suite == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omc-testsuite-html-reports
          path: |
            languages/modelica/ctrf/*.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Coverage Artifacts
        if: always() && steps.check-affected.outputs.run_suite == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-omc-testsuite
          path: "languages/modelica/coverage/omc/*lcov*.info"
          if-no-files-found: ignore
          retention-days: 7

  polyglot_benchmarks:
    name: Polyglot Industrial Benchmarks
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-prefix: "benchmarks"
          cache-wasm: "true"
          build-dsl-templates: "true"
      - name: Build Prerequisites
        run: npx nx run-many -t build --projects=@modelscript/dsl,@modelscript/runtime,@modelscript/simulate,@modelscript/antimony,@modelscript/aspen,@modelscript/bngl,@modelscript/cantera,@modelscript/ccsds,@modelscript/cfd,@modelscript/cgmes,@modelscript/eclipse,@modelscript/epanet,@modelscript/fea,@modelscript/febio,@modelscript/fiber,@modelscript/fortran,@modelscript/genbank,@modelscript/gproms,@modelscript/gtfs,@modelscript/hec-ras,@modelscript/ibis,@modelscript/jsbsim,@modelscript/landgem,@modelscript/modflow,@modelscript/nmtran,@modelscript/ocpp,@modelscript/openadr,@modelscript/opendss,@modelscript/openscenario,@modelscript/opensim,@modelscript/optical,@modelscript/pdb,@modelscript/phreeqc,@modelscript/ran,@modelscript/relap5,@modelscript/rocets,@modelscript/sbml,@modelscript/sbol,@modelscript/sedml,@modelscript/sima,@modelscript/smiles,@modelscript/swmm,@modelscript/touchstone,@modelscript/tough,@modelscript/usd,@modelscript/verilog-a
      - name: Cache Benchmarks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/benchmarks
          key: ${{ runner.os }}-benchmarks-${{ hashFiles('scripts/bench/fetch-benchmarks.ts', 'packages/exchange/src/catalog/benchmarks.catalog.json') }}
          restore-keys: |
            ${{ runner.os }}-benchmarks-
      - name: Fetch Benchmarks
        run: npm run fetch:benchmarks
      - name: Run Industrial Benchmark Matrix
        run: npm run test:benchmarks

  publish_reports:
    needs: [test, modelica_testsuite]
    runs-on: ubuntu-latest
    if: always() && !startsWith(github.event.head_commit.message, 'chore(release):')
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
      - name: Download All CTRF Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ctrf-artifacts
          pattern: ctrf-*
          merge-multiple: false
      - name: Generate Consolidated Hierarchical Test Summary
        id: consolidate_tests
        if: always()
        run: |
          node --experimental-strip-types scripts/ci/consolidate-test-reports.ts \
            --dir=ctrf-artifacts \
            --github-step-summary \
            --output-json=ctrf-artifacts/ctrf-consolidated.json \
            --output-html=ctrf-artifacts/test-report-unified.html
      - name: Upload Consolidated Report Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consolidated-test-report
          path: |
            ctrf-artifacts/ctrf-consolidated.json
            ctrf-artifacts/test-report-unified.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish Test Report & PR Insights
        if: always() && steps.consolidate_tests.outputs.total_tests != '0' && steps.consolidate_tests.outputs.total_tests != '' && github.actor != 'nektos/act' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ctrf-io/github-test-reporter@c2e2997afb89a9a515d83121ce7499e272630446 # v1
        with:
          report-path: "ctrf-artifacts/ctrf-consolidated.json"
          github-report: false
          pull-request-report: true
          flaky-rate-report: true
          slowest-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: coverage-artifacts
          pattern: coverage-*
          merge-multiple: false
        if: always()
      - name: Consolidate Code Coverage Reports
        if: always()
        run: |
          node --experimental-strip-types scripts/ci/consolidate-coverage.ts \
            --dir=coverage-artifacts \
            --github-step-summary \
            --output-lcov=coverage/lcov-consolidated.info \
            --output-json=coverage/coverage-summary.json \
            --threshold=55
      - name: Upload Consolidated Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consolidated-coverage
          path: |
            coverage/lcov-consolidated.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          nx-cache-prefix: "build"
          cache-wasm: "true"
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Ensure Standard Library Assets Exist
        run: npx tsx scripts/build/sync-stdlibs.ts --pack=core
      - name: Build VS Code Extension
        run: npm run build:extension
      - name: Run Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || ( [ -n "$NX_BASE" ] && git rev-parse --verify "$NX_BASE" >/dev/null 2>&1 ); then
            npx nx affected -t build --parallel=3
          else
            npx nx run-many -t build --parallel=3
          fi
      - name: Verify Dist & Exports Integrity
        run: npm run verify:dist
      - name: Verify Package Tarballs & Overrides
        run: npm run verify:pack
      - name: Check If Docs Data Generation Affected
        id: check-docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_docs=true" >> "$GITHUB_OUTPUT"
          else
            BASE_REF="${NX_BASE:-HEAD~1}"
            if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
              BASE_REF="HEAD~1"
            fi
            DOCS_CHANGED=$(git diff --name-only "$BASE_REF" HEAD | grep -E '(^apps/docs/|^apps/cli/|^packages/mcp/|package\.json$|^languages/modelica/src/errors\.ts)' || true)
            if [ -n "$DOCS_CHANGED" ]; then
              echo "Docs-relevant files changed: $DOCS_CHANGED"
              echo "run_docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "No docs-relevant files changed on PR. Skipping full rebuild for docs check."
              echo "run_docs=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build All Packages for Docs Check
        if: steps.check-docs.outputs.run_docs == 'true'
        run: npx nx run-many -t build --parallel=3
      - name: Check Docs Generated Data & Links
        if: steps.check-docs.outputs.run_docs == 'true'
        run: pnpm --filter @modelscript/docs run check
      - name: Package VS Code Extension
        run: npx --yes @vscode/vsce package --no-dependencies --allow-star-activation
        working-directory: dist/extension
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modelscript-vsix
          path: dist/extension/*.vsix
          retention-days: 14

  cross_os_smoke:
    name: Cross-OS Smoke (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-workspace
        with:
          ignore-scripts: "true"
          cache-wasm: "true"
      - name: Build Core Compiler Chain
        run: npx nx run-many -t build --projects=@modelscript/dsl,@modelscript/runtime,@modelscript/modelica --parallel=2
      - name: Verify Cross-Platform Hygiene & Dist Integrity
        run: |
          npm run lint:filenames
          npm run lint:manifests
          npm run lint:types-ratchet
          npm run verify:dist
          npm run verify:pack

  docker_build:
    needs: [build, lint]
    if: github.actor != 'nektos/act' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Calculate Affected Bounds
        id: set-shas
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - name: Check If Docker Services Affected
        id: check-affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            AFFECTED=$(npx nx show projects --affected --projects=@modelscript/api,@modelscript/web,@modelscript/cli,@modelscript/docs,ee || true)
            DOCKER_CHANGED=$(git diff --name-only ${{ steps.set-shas.outputs.base || 'HEAD~1' }} HEAD | grep -E '(^Dockerfile|^docker-compose|\.dockerignore)' || true)
            if [ -n "$AFFECTED" ] || [ -n "$DOCKER_CHANGED" ]; then
              echo "Docker targets affected: $AFFECTED $DOCKER_CHANGED"
              echo "run_docker=true" >> "$GITHUB_OUTPUT"
            else
              echo "No Docker service packages affected on PR. Skipping image build."
              echo "run_docker=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Push to main: running full Docker image bake."
            echo "run_docker=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Dependencies
        if: steps.check-affected.outputs.run_docker == 'true'
        run: pnpm install --frozen-lockfile
        env:
          CXXFLAGS: "-std=c++20"
      - name: Cache Nx
        if: steps.check-affected.outputs.run_docker == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-${{ github.sha }}
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-
      - name: Ensure Standard Library Assets Exist
        if: steps.check-affected.outputs.run_docker == 'true'
        run: npx tsx scripts/build/sync-stdlibs.ts --pack=core
      - name: Fast Rebuild from Cache
        if: steps.check-affected.outputs.run_docker == 'true'
        run: npx nx run-many -t build --parallel=3
      - name: Build VS Code Extension Grammars
        if: steps.check-affected.outputs.run_docker == 'true'
        run: npm run build:extension
      - name: Build PDF Reference Manual for Web & Appliance Images
        if: steps.check-affected.outputs.run_docker == 'true'
        run: |
          if [ ! -f "apps/docs/docs/public/modelscript-reference-manual.pdf" ]; then
            pnpm --filter @modelscript/docs run build:pdf
          fi
      - name: Rebuild Unified Site & Docs with PDF Manual
        if: steps.check-affected.outputs.run_docker == 'true'
        run: npx nx build @modelscript/docs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.check-affected.outputs.run_docker == 'true'
      - name: Log in to GHCR
        if: steps.check-affected.outputs.run_docker == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push EE & CE Docker images
        if: steps.check-affected.outputs.run_docker == 'true'
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,api-ce,web,cli,cli-ce,appliance
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha
            *.args.PREBUILT=true
            api.tags=ghcr.io/modelscript/api-ee:latest
            api.tags=ghcr.io/modelscript/api-ee:sha-${{ github.sha }}
            api-ce.tags=ghcr.io/modelscript/api-ce:latest
            api-ce.tags=ghcr.io/modelscript/api-ce:sha-${{ github.sha }}
            web.tags=ghcr.io/modelscript/web:latest
            web.tags=ghcr.io/modelscript/web:sha-${{ github.sha }}
            cli.tags=ghcr.io/modelscript/cli-ee:latest
            cli.tags=ghcr.io/modelscript/cli-ee:sha-${{ github.sha }}
            cli-ce.tags=ghcr.io/modelscript/cli-ce:latest
            cli-ce.tags=ghcr.io/modelscript/cli-ce:sha-${{ github.sha }}
            appliance.tags=ghcr.io/modelscript/appliance:latest
            appliance.tags=ghcr.io/modelscript/appliance:sha-${{ github.sha }}

  ci_status_gate:
    name: CI Status Gate
    if: always()
    needs:
      - lint
      - build
      - test
      - modelica_testsuite
      - cross_os_smoke
      - polyglot_benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Required Jobs Succeeded
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "Checking status of required CI jobs..."
          echo "  lint: ${{ needs.lint.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  modelica_testsuite: ${{ needs.modelica_testsuite.result }}"
          echo "  cross_os_smoke: ${{ needs.cross_os_smoke.result }}"
          echo "  polyglot_benchmarks: ${{ needs.polyglot_benchmarks.result }}"
          IS_RELEASE_COMMIT=false
          case "$HEAD_COMMIT_MESSAGE" in
            "chore(release):"*) IS_RELEASE_COMMIT=true ;;
          esac
          for res in "${{ needs.lint.result }}" "${{ needs.build.result }}" "${{ needs.test.result }}" "${{ needs.modelica_testsuite.result }}" "${{ needs.polyglot_benchmarks.result }}"; do
            if [ "$res" != "success" ] && { [ "$IS_RELEASE_COMMIT" != "true" ] || [ "$res" != "skipped" ]; }; then
              echo "Error: Required job finished with status '$res'"
              exit 1
            fi
          done
          if [ "${{ needs.cross_os_smoke.result }}" != "success" ] && [ "${{ needs.cross_os_smoke.result }}" != "skipped" ]; then
            echo "Error: cross_os_smoke finished with status '${{ needs.cross_os_smoke.result }}'"
            exit 1
          fi
          echo "All required CI jobs succeeded."

  deploy_production:
    name: Deploy Stack to modelscript.org & ansatz.social
    environment: production
    needs: [docker_build, ci_status_gate]
    if: >-
      !cancelled() &&
      needs.docker_build.result == 'success' &&
      needs.ci_status_gate.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.actor != 'nektos/act' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
      PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
      OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || secrets.OAUTH_GITLAB_CLIENT_ID }}
      GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET || secrets.OAUTH_GITLAB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/deploy-production
        with:
          image-tag: sha-${{ github.sha }}
          prune-docker: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
