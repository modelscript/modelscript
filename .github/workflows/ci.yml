name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@v4
      - name: Run Lint
        run: npx nx affected -t lint --parallel=3

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@v4
      - name: Cache MSL
        id: cache-msl
        uses: actions/cache@v4
        with:
          path: scripts/ModelicaStandardLibrary_v4.1.0.zip
          key: ${{ runner.os }}-msl-v4.1.0
      - name: Download MSL
        if: steps.cache-msl.outputs.cache-hit != 'true'
        run: node scripts/download-msl.cjs
      - name: Cache FMI Simulator
        id: cache-fmusim
        uses: actions/cache@v4
        with:
          path: packages/exchange/validation/fmi/reference_fmus
          key: ${{ runner.os }}-fmusim-v0.0.39
      - name: Fetch FMI Simulator
        if: steps.cache-fmusim.outputs.cache-hit != 'true'
        run: npm run fetch:fmusim --workspace=@modelscript/exchange
      - name: Cache WASM Parsers
        uses: actions/cache@v4
        with:
          path: |
            languages/*/.cache
            packages/runtime/build/*.wasm
            packages/simulate/src/wasm/*.wasm
          key: ${{ runner.os }}-wasm-${{ hashFiles('packages/dsl/src/**', 'packages/runtime/src/wasm/**', 'packages/runtime/assembly/**') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Run Sharded Tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t test --shard=${{ matrix.shard }}/3 --parallel=2
          else
            npx nx run-many -t test --shard=${{ matrix.shard }}/3 --parallel=2
          fi
      - name: Upload CTRF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-${{ matrix.shard }}
          path: "**/ctrf/*.json"
          if-no-files-found: ignore
        if: always()

  publish_reports:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Download All CTRF Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ctrf-artifacts
          pattern: ctrf-*
          merge-multiple: true
      - name: Publish Test Report & PR Insights
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: "ctrf-artifacts/**/*.json"
          github-report: true
          pull-request-report: true
          flaky-rate-report: true
          slowest-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Calculate Affected Bounds
        uses: nrwl/nx-set-shas@v4
      - name: Run Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t build --exclude=@modelscript/morsel --parallel=3
          else
            npx nx run-many -t build --exclude=@modelscript/morsel --parallel=3
          fi
      - name: Build VS Code Extension
        run: npm run build:extension
      - name: Package VS Code Extension
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: dist/extension
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelscript-vsix
          path: dist/extension/*.vsix

  deploy_site:
    needs: [build, test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Build Site
        run: npx nx build @modelscript/site
      - name: SPA fallback for GitHub Pages
        run: |
          cp apps/site/build/client/index.html apps/site/build/client/404.html
      - name: Deploy Site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.MODELSCRIPT_SITE_DEPLOY_PAT }}
          external_repository: modelscript/modelscript.github.io
          publish_dir: ./apps/site/build/client

  docker_build:
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci
        env:
          CXXFLAGS: "-std=c++20"
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Fast Rebuild from Cache
        run: npx nx run-many -t build --exclude=@modelscript/morsel --parallel=3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.PREBUILT=true
