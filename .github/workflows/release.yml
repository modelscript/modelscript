name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (major, minor, patch, premajor, preminor, prepatch, or explicit version)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
      PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Configure Git
        run: |
          git config user.name "Mohamad Omar Nachawati"
          git config user.email "mnachawa@gmail.com"
      - name: Cache MSL
        id: cache-msl
        uses: actions/cache@v4
        with:
          path: |
            scripts/ModelicaStandardLibrary_v4.1.0.zip
            data/libraries/Modelica/4.1.0/extracted
          key: ${{ runner.os }}-msl-v4.1.0
      - name: Install Dependencies
        run: npm ci
        env:
          CXXFLAGS: "-std=c++20"
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-${{ github.sha }}
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-
      - name: Cache WASM Parsers
        uses: actions/cache@v4
        with:
          path: |
            .cache/asc-tests
            languages/*/.cache
            languages/*/dist/*.wasm
            packages/runtime/build/*.wasm
            packages/simulate/src/wasm/*.wasm
            packages/simulate/.cache/**
            packages/dsl/.cache/**
          key: ${{ runner.os }}-wasm-${{ hashFiles('packages/dsl/src/**', 'packages/runtime/src/wasm/**', 'packages/runtime/assembly/**', 'languages/*/assembly/**') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Download MSL
        run: |
          if [ ! -d "data/libraries/Modelica/4.1.0/extracted/Modelica" ]; then
            node scripts/download-msl.cjs --version=4.1.0 --extract --outDir=data/libraries/Modelica/4.1.0/extracted
          fi
      - name: Build
        run: npm run build
      - name: Verify Dist & Exports Integrity
        run: npm run verify:dist
      - name: Test
        run: npm run test:all
      - name: Lint & Manifest Verification
        run: |
          npm run lint:manifests
          npm run check --workspace=@modelscript/docs
          npm run lint:all

      # --- Version, Changelog, Full Monorepo Sync, Tag & Push ---
      - name: Version & Changelog
        run: npx nx release --skip-publish ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Synchronize All Workspace & Desktop Versions
        id: version
        run: |
          npm run sync:versions
          VERSION=$(node -p 'require("./packages/runtime/package.json").version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit --amend --no-edit
            git tag -f -a "v${VERSION}" -m "v${VERSION}"
          fi

      - name: Push Release Commit & Tag Before External Publishing
        run: |
          git push origin HEAD:main
          git push origin "refs/tags/v${{ steps.version.outputs.version }}" --force

      # --- Publish to npm ---
      - name: Publish to npm
        run: npx nx release publish --yes
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Publish VS Code Extension ---
      - name: Build VS Code Extension
        run: npm run build:extension
      - name: Sync VS Code Extension Version
        run: npm run sync:versions
      - name: Package VS Code Extension
        run: npx --yes @vscode/vsce package --no-dependencies --allow-star-activation
        working-directory: dist/extension
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelscript-vsix
          path: dist/extension/*.vsix
      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --allow-star-activation -p ${{ secrets.VSCE_PAT }}
        working-directory: dist/extension
      - name: Publish to Open VSX
        run: npx --yes ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
        working-directory: dist/extension

      # --- Build Unified Site & Docs (bundled into web/appliance Docker images) ---
      - name: Build PDF Manual
        run: npm run build:pdf --workspace=@modelscript/docs
      - name: Build Docs
        run: npx nx build @modelscript/docs --skip-nx-cache

      # --- Publish EE & CE Docker images to GHCR ---
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push EE & CE Docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,api-ce,web,cli,cli-ce,appliance
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.args.PREBUILT=true
            api.tags=ghcr.io/modelscript/api:latest
            api.tags=ghcr.io/modelscript/api:${{ steps.version.outputs.version }}
            api-ce.tags=ghcr.io/modelscript/api-ce:latest
            api-ce.tags=ghcr.io/modelscript/api-ce:${{ steps.version.outputs.version }}
            web.tags=ghcr.io/modelscript/web:latest
            web.tags=ghcr.io/modelscript/web:${{ steps.version.outputs.version }}
            cli.tags=ghcr.io/modelscript/cli:latest
            cli.tags=ghcr.io/modelscript/cli:${{ steps.version.outputs.version }}
            cli-ce.tags=ghcr.io/modelscript/cli-ce:latest
            cli-ce.tags=ghcr.io/modelscript/cli-ce:${{ steps.version.outputs.version }}
            appliance.tags=ghcr.io/modelscript/appliance:latest
            appliance.tags=ghcr.io/modelscript/appliance:${{ steps.version.outputs.version }}

      # --- Roll Out Tagged Release to modelscript.org & ansatz.social via Docker ---
      - name: Trigger Production Docker Compose Rollout via Webhook
        if: env.PROD_DEPLOY_WEBHOOK_URL != ''
        run: |
          curl --fail --silent --show-error -X POST "$PROD_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $PROD_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"tag\":\"${{ steps.version.outputs.version }}\",\"domains\":[\"modelscript.org\",\"ansatz.social\"],\"edition\":\"ee\"}"
      - name: Roll Out Docker Stack to modelscript.org & ansatz.social via SSH
        if: env.PROD_SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
          fi

          TARGET_DIR="${PROD_DEPLOY_PATH:-/opt/modelscript}"

          # 1. Install Docker & Compose plugin if not already installed
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "which docker >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sh)"

          # 2. Ensure target directories exist
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "mkdir -p ${TARGET_DIR}/config"

          # 3. Synchronize compose files and Caddy / broker / DB runtime configs
          scp docker-compose.yml docker-compose.prod.yml "${PROD_SSH_USER}@${PROD_SSH_HOST}:${TARGET_DIR}/"
          scp config/Caddyfile config/mosquitto.conf config/init-timescaledb.sql "${PROD_SSH_USER}@${PROD_SSH_HOST}:${TARGET_DIR}/config/"

          # 4. Bootstrap / update .env.production from GitHub secret if provided
          if [ -n "$PROD_ENV_FILE" ]; then
            printf '%s\n' "$PROD_ENV_FILE" | ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "cat > ${TARGET_DIR}/.env.production && chmod 600 ${TARGET_DIR}/.env.production"
          fi

          # 5. Pull release images, launch the stack, and verify both domains
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "cd ${TARGET_DIR} && \
            IMAGE_TAG=${{ steps.version.outputs.version }} docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production --profile federated pull && \
            IMAGE_TAG=${{ steps.version.outputs.version }} docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production --profile federated up -d --wait --remove-orphans && \
            curl --fail --silent --show-error http://127.0.0.1:3000/health >/dev/null && \
            curl --fail --silent --show-error -H 'Host: modelscript.org' http://127.0.0.1:3001/healthz >/dev/null && \
            curl --fail --silent --show-error -H 'Host: ansatz.social' http://127.0.0.1:3001/healthz >/dev/null && \
            docker image prune -f --filter 'until=72h'"
