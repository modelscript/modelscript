name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version strategy: auto (pre-bumped or Conventional Commits), current (manifest version as-is), or relative bump"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - current
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
      PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
      OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || secrets.OAUTH_GITLAB_CLIENT_ID }}
      GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET || secrets.OAUTH_GITLAB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Configure Git
        run: |
          git config user.name "Mohamad Omar Nachawati"
          git config user.email "mnachawa@gmail.com"
      - name: Cache MSL
        id: cache-msl
        uses: actions/cache@v4
        with:
          path: |
            scripts/ModelicaStandardLibrary_v4.1.0.zip
            data/libraries/Modelica/4.1.0/extracted
          key: ${{ runner.os }}-msl-v4.1.0
      - name: Install Dependencies
        run: npm ci
        env:
          CXXFLAGS: "-std=c++20"
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-${{ github.sha }}
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-
      - name: Cache WASM Parsers
        uses: actions/cache@v4
        with:
          path: |
            .cache/asc-tests
            languages/*/.cache
            languages/*/dist/*.wasm
            packages/runtime/build/*.wasm
            packages/simulate/src/wasm/*.wasm
            packages/simulate/.cache/**
            packages/dsl/.cache/**
          key: ${{ runner.os }}-wasm-${{ hashFiles('packages/dsl/src/**', 'packages/runtime/src/wasm/**', 'packages/runtime/assembly/**', 'languages/*/assembly/**') }}
          restore-keys: |
            ${{ runner.os }}-wasm-
      - name: Download Standard Libraries
        run: |
          npx tsx scripts/sync-stdlibs.ts --pack=core
          if [ ! -d "data/libraries/Modelica/4.1.0/extracted/Modelica" ]; then
            node scripts/download-msl.cjs --version=4.1.0 --extract --outDir=data/libraries/Modelica/4.1.0/extracted
          fi
      - name: Build
        run: npm run build
      - name: Verify Dist & Exports Integrity
        run: npm run verify:dist
      - name: Test
        run: npm run test:all
      - name: Lint & Manifest Verification
        run: |
          npm run lint:manifests
          npm run check --workspace=@modelscript/docs
          npm run lint:all

      # --- Version, Changelog, Full Monorepo Sync, Tag & Push ---
      - name: Version, Changelog & Tag (Smart Hybrid Orchestrator)
        id: version
        run: npx tsx scripts/ci-release-version.ts --bump="${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Commit & Tag Before External Publishing
        run: |
          git push origin HEAD:main
          git push origin "refs/tags/v${{ steps.version.outputs.version }}" --force

      # --- Publish to npm (Idempotent) ---
      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@modelscript/runtime@${VERSION}" version >/dev/null 2>&1; then
            echo "✓ @modelscript/*@${VERSION} is already published on npm. Skipping duplicate npm publish."
          else
            NODE_OPTIONS="--require ./scripts/nx-minimatch-shim.cjs" npx nx release publish --yes
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Publish VS Code Extension ---
      - name: Build VS Code Extension
        run: npm run build:extension
      - name: Sync VS Code Extension Version
        run: npm run sync:versions
      - name: Package VS Code Extension
        run: npx --yes @vscode/vsce package --no-dependencies --allow-star-activation
        working-directory: dist/extension
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelscript-vsix
          path: dist/extension/*.vsix
      - name: Create or Update GitHub Release & Attach VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .cache/release-notes.md
          files: dist/extension/*.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce publish --skip-duplicate --no-dependencies --allow-star-activation -p ${{ secrets.VSCE_PAT }}
        working-directory: dist/extension
      - name: Publish to Open VSX
        run: npx --yes ovsx publish *.vsix --skip-duplicate -p ${{ secrets.OVSX_PAT }}
        working-directory: dist/extension

      # --- Build Unified Site & Docs (bundled into web/appliance Docker images) ---
      - name: Build PDF Manual
        run: npm run build:pdf --workspace=@modelscript/docs
      - name: Build Docs
        run: npx nx build @modelscript/docs --skip-nx-cache

      # --- Publish EE & CE Docker images to GHCR ---
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push EE & CE Docker images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: api,api-ce,web,cli,cli-ce,appliance
          push: true
          set: |
            *.cache-from=type=gha
            *.args.PREBUILT=true
            api.tags=ghcr.io/modelscript/api-ee:latest
            api.tags=ghcr.io/modelscript/api-ee:${{ steps.version.outputs.version }}
            api-ce.tags=ghcr.io/modelscript/api-ce:latest
            api-ce.tags=ghcr.io/modelscript/api-ce:${{ steps.version.outputs.version }}
            web.tags=ghcr.io/modelscript/web:latest
            web.tags=ghcr.io/modelscript/web:${{ steps.version.outputs.version }}
            cli.tags=ghcr.io/modelscript/cli-ee:latest
            cli.tags=ghcr.io/modelscript/cli-ee:${{ steps.version.outputs.version }}
            cli-ce.tags=ghcr.io/modelscript/cli-ce:latest
            cli-ce.tags=ghcr.io/modelscript/cli-ce:${{ steps.version.outputs.version }}
            appliance.tags=ghcr.io/modelscript/appliance:latest
            appliance.tags=ghcr.io/modelscript/appliance:${{ steps.version.outputs.version }}

      # --- Roll Out Tagged Release to modelscript.org & ansatz.social via Docker ---
      - name: Trigger Production Docker Compose Rollout via Webhook
        if: env.PROD_DEPLOY_WEBHOOK_URL != ''
        run: |
          curl --fail --silent --show-error -X POST "$PROD_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $PROD_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${GITHUB_SHA}\",\"tag\":\"${{ steps.version.outputs.version }}\",\"domains\":[\"modelscript.org\",\"ansatz.social\"],\"edition\":\"ee\"}"
      - name: Roll Out Docker Stack to modelscript.org & ansatz.social via SSH
        if: env.PROD_SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat << 'EOF' > ~/.ssh/config
          Host *
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config
          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

          TARGET_DIR="${PROD_DEPLOY_PATH:-/opt/modelscript}"

          # 1. Install Docker & Compose plugin if not already installed
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "which docker >/dev/null 2>&1 || (curl -fsSL https://get.docker.com | sh)"

          # 2. Ensure target directories exist
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "mkdir -p ${TARGET_DIR}/config ${TARGET_DIR}/scripts ${TARGET_DIR}/backups"

          # 3. Synchronize compose files, configs, and ops deployment scripts
          scp docker-compose.yml docker-compose.prod.yml "${PROD_SSH_USER}@${PROD_SSH_HOST}:${TARGET_DIR}/"
          scp config/Caddyfile config/mosquitto.conf config/init-timescaledb.sql "${PROD_SSH_USER}@${PROD_SSH_HOST}:${TARGET_DIR}/config/"
          scp scripts/ops/*.sh "${PROD_SSH_USER}@${PROD_SSH_HOST}:${TARGET_DIR}/scripts/"
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "chmod +x ${TARGET_DIR}/scripts/*.sh"

          # 4. Bootstrap / update .env.production from GitHub secret if provided
          if [ -n "$PROD_ENV_FILE" ]; then
            printf '%s\n' "$PROD_ENV_FILE" | ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "cat > ${TARGET_DIR}/.env.production && chmod 600 ${TARGET_DIR}/.env.production"
          fi
          if [ -n "$OAUTH_GITHUB_CLIENT_ID" ] || [ -n "$GITLAB_CLIENT_ID" ]; then
            {
              [ -n "$OAUTH_GITHUB_CLIENT_ID" ] && printf 'GITHUB_CLIENT_ID=%s\n' "$OAUTH_GITHUB_CLIENT_ID"
              [ -n "$OAUTH_GITHUB_CLIENT_SECRET" ] && printf 'GITHUB_CLIENT_SECRET=%s\n' "$OAUTH_GITHUB_CLIENT_SECRET"
              [ -n "$GITLAB_CLIENT_ID" ] && printf 'GITLAB_CLIENT_ID=%s\n' "$GITLAB_CLIENT_ID"
              [ -n "$GITLAB_CLIENT_SECRET" ] && printf 'GITLAB_CLIENT_SECRET=%s\n' "$GITLAB_CLIENT_SECRET"
            } | ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "touch ${TARGET_DIR}/.env.production && chmod 600 ${TARGET_DIR}/.env.production && grep -v -E '^(GITHUB_CLIENT_ID|GITHUB_CLIENT_SECRET|GITLAB_CLIENT_ID|GITLAB_CLIENT_SECRET)=' ${TARGET_DIR}/.env.production > ${TARGET_DIR}/.env.production.tmp || true && cat - >> ${TARGET_DIR}/.env.production.tmp && mv ${TARGET_DIR}/.env.production.tmp ${TARGET_DIR}/.env.production"
          fi
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "
              touch ${TARGET_DIR}/.env.production &&
              chmod 600 ${TARGET_DIR}/.env.production &&
              (grep -v '^RESEND_API_KEY=' ${TARGET_DIR}/.env.production > ${TARGET_DIR}/.env.production.tmp || true) &&
              mv ${TARGET_DIR}/.env.production.tmp ${TARGET_DIR}/.env.production &&
              printf 'RESEND_API_KEY=%s\n' \"\$(cat)\" >> ${TARGET_DIR}/.env.production
            "
          fi
          if [ -n "$ADMIN_INIT_PASSWORD" ]; then
            printf '%s' "$ADMIN_INIT_PASSWORD" | ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "
              touch ${TARGET_DIR}/.env.production &&
              chmod 600 ${TARGET_DIR}/.env.production &&
              (grep -v '^ADMIN_INIT_PASSWORD=' ${TARGET_DIR}/.env.production > ${TARGET_DIR}/.env.production.tmp || true) &&
              mv ${TARGET_DIR}/.env.production.tmp ${TARGET_DIR}/.env.production &&
              printf 'ADMIN_INIT_PASSWORD=%s\n' \"\$(cat)\" >> ${TARGET_DIR}/.env.production
            "
          fi

          # 5. Authenticate droplet to GHCR and execute production rollout sentinel with automated rollback
          ssh "${PROD_SSH_USER}@${PROD_SSH_HOST}" "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null 2>&1 || true && \
            IMAGE_TAG=${{ steps.version.outputs.version }} TARGET_DIR=${TARGET_DIR} ${TARGET_DIR}/scripts/deploy.sh"
