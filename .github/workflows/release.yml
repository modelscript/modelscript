name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version strategy: auto (pre-bumped or Conventional Commits), current (manifest version as-is), or relative bump"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - current
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
      PROD_DEPLOY_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_INIT_PASSWORD: ${{ secrets.ADMIN_INIT_PASSWORD }}
      OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
      OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID || secrets.OAUTH_GITLAB_CLIENT_ID }}
      GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET || secrets.OAUTH_GITLAB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Configure Git
        run: |
          git config user.name "Mohamad Omar Nachawati"
          git config user.email "mnachawa@gmail.com"
      - name: Cache MSL
        id: cache-msl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/ModelicaStandardLibrary_v4.1.0.zip
            data/libraries/Modelica/4.1.0/extracted
          key: ${{ runner.os }}-msl-v4.1.0
      - uses: ./.github/actions/setup-workspace
        with:
          cxxflags: "-std=c++20"
          nx-cache-prefix: "release"
          cache-wasm: "true"
      - name: Download Standard Libraries
        run: |
          npx tsx scripts/build/sync-stdlibs.ts --pack=core
          if [ ! -d "data/libraries/Modelica/4.1.0/extracted/Modelica" ]; then
            node scripts/build/download-msl.cjs --version=4.1.0 --extract --outDir=data/libraries/Modelica/4.1.0/extracted
          fi
      - name: Build
        run: npm run build
      - name: Verify Dist & Exports Integrity
        run: npm run verify:dist
      - name: Test
        run: npm run test:all
      - name: Lint & Manifest Verification
        run: |
          npm run lint:manifests
          pnpm --filter @modelscript/docs run check
          npm run lint:all

      # --- Version, Changelog, Full Monorepo Sync, Tag & Push ---
      - name: Version, Changelog & Tag (Smart Hybrid Orchestrator)
        id: version
        run: npx tsx scripts/release/ci-release-version.ts --bump="${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Commit & Tag Before External Publishing
        run: |
          git push origin HEAD:main
          git push origin "refs/tags/v${{ steps.version.outputs.version }}" --force

      # --- Publish to npm (Idempotent) ---
      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@modelscript/runtime@${VERSION}" version >/dev/null 2>&1; then
            echo "✓ @modelscript/*@${VERSION} is already published on npm. Skipping duplicate npm publish."
          else
            NODE_OPTIONS="--require ./scripts/release/nx-minimatch-shim.cjs" npx nx release publish --yes
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Publish VS Code Extension ---
      - name: Build VS Code Extension
        run: npm run build:ide:extension
      - name: Sync VS Code Extension Version
        run: npm run sync:versions
      - name: Package VS Code Extension
        run: npx --yes @vscode/vsce@3.3.2 package --no-dependencies -o modelscript.vsix
        working-directory: apps/ide/dist/extension
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modelscript-vsix
          path: apps/ide/dist/extension/modelscript.vsix
      - name: Create or Update GitHub Release & Attach VSIX
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .cache/release-notes.md
          files: apps/ide/dist/extension/modelscript.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@3.3.2 publish --skip-duplicate --no-dependencies --packagePath modelscript.vsix -p ${{ secrets.VSCE_PAT }}
        working-directory: apps/ide/dist/extension
      - name: Publish to Open VSX
        run: npx --yes ovsx@0.10.1 publish modelscript.vsix --skip-duplicate -p ${{ secrets.OVSX_PAT }}
        working-directory: apps/ide/dist/extension

      # --- Build Unified Site & Docs (bundled into web/appliance Docker images) ---
      - name: Build PDF Manual
        run: pnpm --filter @modelscript/docs run build:pdf
      - name: Build Docs
        run: npx nx build @modelscript/docs --skip-nx-cache

      # --- Publish EE & CE Docker images to GHCR ---
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push EE & CE Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-compose.yml
          targets: api,api-ce,web,cli,cli-ce,appliance
          push: true
          set: |
            *.cache-from=type=gha
            *.args.PREBUILT=true
            api.tags=ghcr.io/modelscript/api-ee:latest
            api.tags=ghcr.io/modelscript/api-ee:${{ steps.version.outputs.version }}
            api-ce.tags=ghcr.io/modelscript/api-ce:latest
            api-ce.tags=ghcr.io/modelscript/api-ce:${{ steps.version.outputs.version }}
            web.tags=ghcr.io/modelscript/web:latest
            web.tags=ghcr.io/modelscript/web:${{ steps.version.outputs.version }}
            cli.tags=ghcr.io/modelscript/cli-ee:latest
            cli.tags=ghcr.io/modelscript/cli-ee:${{ steps.version.outputs.version }}
            cli-ce.tags=ghcr.io/modelscript/cli-ce:latest
            cli-ce.tags=ghcr.io/modelscript/cli-ce:${{ steps.version.outputs.version }}
            appliance.tags=ghcr.io/modelscript/appliance:latest
            appliance.tags=ghcr.io/modelscript/appliance:${{ steps.version.outputs.version }}

      # --- Roll Out Tagged Release to modelscript.org & ansatz.social via Docker ---
      - uses: ./.github/actions/deploy-production
        with:
          image-tag: ${{ steps.version.outputs.version }}
          prune-docker: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
