name: Build Native Binaries & Platform VSIXs

on:
  workflow_call:
    inputs:
      version:
        description: "Release version to stamp into VSIXs and HPC tarballs"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref (branch, tag, or SHA) to check out"
        required: false
        type: string
        default: ""
      enable_dawn:
        description: "Link prebuilt Dawn WebGPU runtime when available"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override"
        required: false
        type: string
        default: ""
      enable_dawn:
        description: "Link prebuilt Dawn WebGPU runtime"
        required: false
        type: boolean
        default: true

jobs:
  build-platform-native:
    name: Build Native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            hpc: true
          - target: linux-arm64
            os: ubuntu-24.04-arm
            hpc: true
          - target: darwin-arm64
            os: macos-latest
            hpc: false
          - target: darwin-x64
            os: macos-15-intel
            hpc: false
          - target: win32-x64
            os: windows-latest
            hpc: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache WABT, SIMDe & Dawn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/wabt-*
            .cache/simde-*
            .cache/dawn-*
            .cache/node-lib-*
          key: ${{ runner.os }}-${{ matrix.target }}-native-deps-v2

      - name: Download Node.js headers & import library (Windows MSVC N-API)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          NODE_VER="$(node -v)"
          mkdir -p ".cache/node-lib-${NODE_VER}"
          if [ ! -f ".cache/node-lib-${NODE_VER}/node.lib" ]; then
            curl -fsSL "https://nodejs.org/dist/${NODE_VER}/win-x64/node.lib" -o ".cache/node-lib-${NODE_VER}/node.lib"
          fi
          if [ ! -f ".cache/node-lib-${NODE_VER}/include/node/node_api.h" ]; then
            curl -fsSL "https://nodejs.org/dist/${NODE_VER}/node-${NODE_VER}-headers.tar.gz" | tar -xz --strip-components=1 -C ".cache/node-lib-${NODE_VER}"
          fi
          CACHE_WIN_DIR="$(cygpath -m "$(pwd)")/.cache/node-lib-${NODE_VER}"
          echo "NODE_LIB_FILE=${CACHE_WIN_DIR}/node.lib" >> "$GITHUB_ENV"
          echo "NODE_INCLUDE_DIR=${CACHE_WIN_DIR}/include/node" >> "$GITHUB_ENV"

      - name: Fetch prebuilt Dawn WebGPU (with graceful fallback)
        if: ${{ inputs.enable_dawn }}
        shell: bash
        run: |
          if npx tsx scripts/build/fetch-dawn.ts && [ -f "packages/native/generated/dawn_paths.cmake" ]; then
            echo "MS_ENABLE_DAWN=1" >> "$GITHUB_ENV"
          else
            echo "Dawn prebuilt archive unavailable for ${{ matrix.target }}; continuing with CPU wasm2c build."
            echo "MS_ENABLE_DAWN=0" >> "$GITHUB_ENV"
          fi

      - name: Build core packages & native AssemblyScript targets
        shell: bash
        run: |
          pnpm --filter @modelscript/dsl run build
          pnpm --filter @modelscript/solve run build
          pnpm --filter @modelscript/runtime run build
          pnpm --filter @modelscript/runtime asbuild:native
          pnpm --filter @modelscript/simulate... run build
          pnpm --filter @modelscript/simulate run asbuild:native

      - name: Transpile wasm2c & compile native addon + HPC worker
        shell: bash
        run: |
          pnpm --filter @modelscript/native run build:native
          pnpm --filter @modelscript/native run build

      - name: Run native vs WASM bit-exact parity & HPC worker tests
        shell: bash
        run: |
          npx tsx --test packages/native/tests/native-parity.test.ts
          if [ -f "packages/native/tests/hpc-worker.test.ts" ]; then
            npx tsx --test packages/native/tests/hpc-worker.test.ts
          fi

      - name: Run msx-hpc-worker self-test (Linux HPC)
        if: ${{ matrix.hpc }}
        shell: bash
        run: |
          ./packages/native/prebuilds/${{ matrix.target }}/msx-hpc-worker --version --info --selftest
          mkdir -p dist/release-artifacts
          tar -czf "dist/release-artifacts/msx-hpc-worker-${{ matrix.target }}.tar.gz" \
            -C "packages/native/prebuilds/${{ matrix.target }}" msx-hpc-worker

      - name: Build platform-native VS Code extension (${{ matrix.target }})
        shell: bash
        run: |
          pnpm --filter @modelscript/ide-client^... run build
          npx tsx apps/ide/scripts/build-extension.ts \
            --target="${{ matrix.target }}" \
            --outdir="apps/ide/dist/extension-${{ matrix.target }}" \
            --native-addon="packages/native/prebuilds/${{ matrix.target }}/modelscript_native.node"
          if [ -n "${{ inputs.version }}" ]; then
            node -e "const fs=require('fs'),p='apps/ide/dist/extension-${{ matrix.target }}/package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ inputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2));"
          fi

      - name: Package platform-native VSIX (${{ matrix.target }})
        shell: bash
        working-directory: apps/ide/dist/extension-${{ matrix.target }}
        run: |
          mkdir -p ../../../../dist/release-artifacts
          npx --yes @vscode/vsce@3.3.2 package \
            --target "${{ matrix.target }}" \
            --no-dependencies \
            -o "../../../../dist/release-artifacts/modelscript-${{ matrix.target }}.vsix"

      - name: Verify desktop VSIX bundles native addon
        shell: bash
        run: |
          test -f "apps/ide/dist/extension-${{ matrix.target }}/native/modelscript_native.node"
          test -f "apps/ide/dist/extension-${{ matrix.target }}/dist/desktopClientMain.js"
          test -f "dist/release-artifacts/modelscript-${{ matrix.target }}.vsix"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-${{ matrix.target }}
          path: dist/release-artifacts/*
          retention-days: 14

  build-web-vsix:
    name: Build Pure-WASM Web VSIX (web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages (WASM)
        run: |
          pnpm --filter @modelscript/dsl run build
          pnpm --filter @modelscript/solve run build
          pnpm --filter @modelscript/runtime run build
          pnpm --filter @modelscript/simulate... run build

      - name: Build pure-WASM web extension
        run: |
          pnpm --filter @modelscript/ide-client^... run build
          npx tsx apps/ide/scripts/build-extension.ts \
            --target=web \
            --outdir="apps/ide/dist/extension-web"
          if [ -n "${{ inputs.version }}" ]; then
            node -e "const fs=require('fs'),p='apps/ide/dist/extension-web/package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ inputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2));"
          fi

      - name: Verify web VSIX contains zero native binaries
        run: |
          test ! -d "apps/ide/dist/extension-web/native"
          test ! -f "apps/ide/dist/extension-web/dist/desktopClientMain.js"
          test -f "apps/ide/dist/extension-web/dist/browserClientMain.js"

      - name: Package web VSIX
        working-directory: apps/ide/dist/extension-web
        run: |
          mkdir -p ../../../../dist/release-artifacts
          npx --yes @vscode/vsce@3.3.2 package \
            --target web \
            --no-dependencies \
            -o "../../../../dist/release-artifacts/modelscript-web.vsix"

      - name: Upload web VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-web
          path: dist/release-artifacts/modelscript-web.vsix
          retention-days: 14

  build-hpc-cuda-fp64:
    name: Build HPC Worker (linux-x64-cuda FP64)
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install build prerequisites
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates cmake ninja-build git wabt
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs
          corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native AssemblyScript targets & CUDA FP64 HPC worker
        env:
          MS_ENABLE_CUDA: "1"
        run: |
          pnpm --filter @modelscript/runtime run asbuild:native
          pnpm --filter @modelscript/simulate run asbuild:native
          npx tsx scripts/build/wasm2c-codegen.ts --skip-asc
          cmake -S packages/native -B packages/native/build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMS_BUILD_NAPI=OFF \
            -DMS_BUILD_HPC_WORKER=ON \
            -DMS_ENABLE_CUDA=ON
          cmake --build packages/native/build-cuda --parallel
          STUB_DIR="/usr/local/cuda/lib64/stubs"
          if [ -f "$STUB_DIR/libcuda.so" ] && [ ! -e "$STUB_DIR/libcuda.so.1" ]; then
            ln -s libcuda.so "$STUB_DIR/libcuda.so.1"
          fi
          LD_LIBRARY_PATH="$STUB_DIR:${LD_LIBRARY_PATH:-}" ./packages/native/build-cuda/msx-hpc-worker --version --info --selftest
          mkdir -p dist/release-artifacts
          tar -czf dist/release-artifacts/msx-hpc-worker-linux-x64-cuda.tar.gz \
            -C packages/native/build-cuda msx-hpc-worker

      - name: Upload CUDA HPC worker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-linux-x64-cuda
          path: dist/release-artifacts/msx-hpc-worker-linux-x64-cuda.tar.gz
          retention-days: 14
