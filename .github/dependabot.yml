version: 2
updates:
  # Root npm monorepo dependencies
  # Note: Routine version update PRs are disabled (open-pull-requests-limit: 0).
  # Dependabot security vulnerability alerts and security update PRs remain enabled.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflows and actions versions
  # Note: Routine version update PRs are disabled (open-pull-requests-limit: 0).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"

  # Docker base images and build dependencies
  # Note: Routine version update PRs are disabled (open-pull-requests-limit: 0).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(docker)"
