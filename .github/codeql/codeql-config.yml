name: "ModelScript CodeQL Config"

paths-ignore:
  - "**/tests/**"
  - "**/test/**"
  - "**/testsuite/**"
  - "**/validation/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/data/**"
  - "**/.cache/**"
  - "**/vscode-web/**"
  - "scripts/**"
  - "languages/*/build.js"

query-filters:
  - exclude:
      id: js/request-forgery
