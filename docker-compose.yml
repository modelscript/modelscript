services:
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone", "federated"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
      - ide
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["internal", "federated"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["internal", "federated"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=modelscript_historian
      - POSTGRES_USER=modelscript
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD:-modelscript}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelscript -d modelscript_historian"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/modelscript/api:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    volumes:
      - api-data:/app/apps/api/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FEDERATION_MODE=${FEDERATION_MODE:-disabled}
      - JWT_SECRET=${JWT_SECRET:-modelscript-dev-secret}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-}
      - TIMESCALE_URL=${TIMESCALE_URL:-}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=450}
    restart: unless-stopped

  morsel:
    image: ghcr.io/modelscript/morsel:latest
    profiles: ["internal", "federated"]
    build:
      context: .
      target: morsel
    ports:
      - "3002:3002"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3002
    restart: unless-stopped

  web:
    image: ghcr.io/modelscript/web:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: web
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

  ide:
    image: ghcr.io/modelscript/ide:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: ide
    ports:
      - "3003:3003"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=450}
    restart: unless-stopped

volumes:
  api-data:
  mqtt-data:
  timescale-data:
  caddy-data:
  caddy-config:
