services:
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone", "federated"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      ide:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["internal", "federated"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["internal", "federated"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=modelscript_historian
      - POSTGRES_USER=modelscript
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD:-modelscript}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelscript -d modelscript_historian"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/modelscript/api:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: api
    ports:
      - "3000:3000"
    volumes:
      - api-data:/app/apps/api/data
      - api-uploads:/app/apps/api/uploads
      - api-thumbnails:/app/apps/api/public/thumbnails
      - api-packages:/app/apps/api/storage
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TRUST_PROXY=true
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - FEDERATION_MODE=${FEDERATION_MODE:-disabled}
      - JWT_SECRET=${JWT_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - ADMIN_INIT_USERNAME=${ADMIN_INIT_USERNAME:-}
      - ADMIN_INIT_EMAIL=${ADMIN_INIT_EMAIL:-}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-}
      - TIMESCALE_URL=${TIMESCALE_URL:-}
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/apps/api/data/GeoLite2-City.mmdb}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=450}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/modelscript/web:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: web
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  ide:
    image: ghcr.io/modelscript/ide:latest
    profiles: ["standalone", "internal", "federated"]
    build:
      context: .
      target: ide
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=450}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cli:
    image: ghcr.io/modelscript/cli:latest
    profiles: ["cli"]
    build:
      context: .
      target: cli

  appliance:
    image: ghcr.io/modelscript/appliance:latest
    profiles: ["appliance"]
    build:
      context: .
      target: appliance
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/apps/api/data
      - api-uploads:/app/apps/api/uploads
    environment:
      - NODE_ENV=production
      - PORT=8080
      - ENTERPRISE_APPLIANCE=true
      - AIRGAP_ENFORCED=true
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/apps/api/data/GeoLite2-City.mmdb}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  api-data:
  api-uploads:
  api-thumbnails:
  api-packages:
  mqtt-data:
  timescale-data:
  caddy-data:
  caddy-config:
