services:
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone", "internal", "federated", "flagship", "federated-lite", "corporate", "quick-tunnel"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
      - DOCS_DOMAIN=${DOCS_DOMAIN:-http://docs.localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["internal", "federated", "flagship", "corporate-historian"]
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    profiles: ["internal", "federated", "flagship", "corporate-historian"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=modelscript_historian
      - POSTGRES_USER=modelscript
      - POSTGRES_PASSWORD=${TIMESCALE_PASSWORD:-modelscript}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelscript -d modelscript_historian"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/modelscript/api:latest
    profiles: ["standalone", "internal", "federated", "flagship", "federated-lite", "corporate", "quick-tunnel"]
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api-data:/app/apps/api/data
      - api-backups:/app/apps/api/data/backups
      - api-uploads:/app/apps/api/uploads
      - api-thumbnails:/app/apps/api/public/thumbnails
      - api-packages:/app/apps/api/storage
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MSX_EDITION=${MSX_EDITION:-ce}
      - MSX_LICENSE_ENFORCE=${MSX_LICENSE_ENFORCE:-true}
      - MSX_LICENSE_KEY=${MSX_LICENSE_KEY:-}
      - TRUST_PROXY=true
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FEDERATION_MODE=${FEDERATION_MODE:-disabled}
      - DEPLOYMENT_PRESET=${DEPLOYMENT_PRESET:-}
      - AUTO_SEED_ADMIN=${AUTO_SEED_ADMIN:-false}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_DRIVER=${EMAIL_DRIVER:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - ADMIN_INIT_USERNAME=${ADMIN_INIT_USERNAME:-}
      - ADMIN_INIT_EMAIL=${ADMIN_INIT_EMAIL:-}
      - ADMIN_INIT_PASSWORD=${ADMIN_INIT_PASSWORD:-}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-${BOT_SECRET_ENCRYPTION_KEY:-}}
      - REQUIRE_ADMIN_SUDO=${REQUIRE_ADMIN_SUDO:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PREFIX=${S3_PREFIX:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-}
      - HPC_BACKEND=${HPC_BACKEND:-${HPC_DRIVER:-local}}
      - SLURM_REST_URL=${SLURM_REST_URL:-}
      - SLURM_USER=${SLURM_USER:-}
      - SLURM_JWT_TOKEN=${SLURM_JWT_TOKEN:-}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-}
      - TIMESCALE_URL=${TIMESCALE_URL:-}
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/apps/api/data/GeoLite2-City.mmdb}
      - GEOLOCATION_DB_PATH=${GEOLOCATION_DB_PATH:-/app/apps/api/data/GeoLite2-City.mmdb}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=1024}
      - ANALYTICS_FLUSH_INTERVAL_MS=${ANALYTICS_FLUSH_INTERVAL_MS:-5000}
      - ANALYTICS_MAX_BUFFER_SIZE=${ANALYTICS_MAX_BUFFER_SIZE:-2000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/modelscript/web:latest
    profiles: ["standalone", "internal", "federated", "flagship", "federated-lite", "corporate", "quick-tunnel"]
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api-ce:
    image: ghcr.io/modelscript/api-ce:latest
    profiles: ["ce"]
    build:
      context: .
      target: api-ce
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - api-data:/app/apps/api/data
      - api-backups:/app/apps/api/data/backups
      - api-uploads:/app/apps/api/uploads
      - api-thumbnails:/app/apps/api/public/thumbnails
      - api-packages:/app/apps/api/storage
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MSX_EDITION=ce
      - TRUST_PROXY=true
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - FEDERATION_MODE=${FEDERATION_MODE:-disabled}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=450}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cli:
    image: ghcr.io/modelscript/cli:latest
    profiles: ["cli"]
    build:
      context: .
      target: cli
    environment:
      - MSX_EDITION=${MSX_EDITION:-ee}
      - MSX_LICENSE_ENFORCE=${MSX_LICENSE_ENFORCE:-true}
      - MSX_LICENSE_KEY=${MSX_LICENSE_KEY:-}

  cli-ce:
    image: ghcr.io/modelscript/cli-ce:latest
    profiles: ["ce-cli"]
    build:
      context: .
      target: cli-ce
    environment:
      - MSX_EDITION=ce

  appliance:
    image: ghcr.io/modelscript/appliance:latest
    profiles: ["appliance"]
    build:
      context: .
      target: appliance
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/apps/api/data
      - api-backups:/app/apps/api/data/backups
      - api-uploads:/app/apps/api/uploads
      - api-thumbnails:/app/apps/api/public/thumbnails
    environment:
      - NODE_ENV=production
      - PORT=8080
      - MSX_EDITION=${MSX_EDITION:-ee}
      - MSX_LICENSE_ENFORCE=${MSX_LICENSE_ENFORCE:-true}
      - MSX_LICENSE_KEY=${MSX_LICENSE_KEY:?Set MSX_LICENSE_KEY to your signed Enterprise Appliance license token}
      - ENTERPRISE_APPLIANCE=true
      - AIRGAP_ENFORCED=true
      - GEOIP_DB_PATH=${GEOIP_DB_PATH:-/app/apps/api/data/GeoLite2-City.mmdb}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel", "federated-tunnel", "flagship", "federated", "federated-lite"]
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$TUNNEL_TOKEN" ]; then
          echo "[Cloudflare Tunnel] Starting tunnel daemon..."
          exec cloudflared tunnel --no-autoupdate run
        else
          echo "[Cloudflare Tunnel] No CLOUDFLARE_TUNNEL_TOKEN provided. Idling in standby mode."
          exec tail -f /dev/null
        fi
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - TUNNEL_METRICS=0.0.0.0:2000
    depends_on:
      - caddy

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    command: tunnel --url http://caddy:80
    depends_on:
      - caddy

volumes:
  api-data:
  api-backups:
  api-uploads:
  api-thumbnails:
  api-packages:
  mqtt-data:
  timescale-data:
  caddy-data:
  caddy-config:
